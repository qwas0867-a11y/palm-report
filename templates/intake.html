<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손금 정밀 리포트 신청</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Noto Sans CJK KR", -apple-system, sans-serif;
    background: #f7f2ea; color: #24211d; margin: 0; padding: 40px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  header .brand { font-size: 12px; letter-spacing: 3px; color: #a97142; font-weight: 700; }
  header h1 { font-size: 26px; margin: 10px 0 8px; }
  header p { color: #6b6155; font-size: 14px; margin: 0; }

  form { background: #fff; border: 1px solid #ecdfc9; border-radius: 16px; padding: 28px 26px; }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .field .hint { font-weight: 400; color: #8a7d68; font-size: 12px; margin-left: 6px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid #ddd0b8; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fdfbf7;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .row2 { display: flex; gap: 14px; }
  .row2 > div { flex: 1; }

  .radio-group, .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-group label, .chip-group label {
    border: 1px solid #ddd0b8; border-radius: 20px; padding: 8px 16px; font-size: 13px;
    cursor: pointer; background: #fdfbf7; font-weight: 400;
  }
  .radio-group input, .chip-group input { display: none; }
  .radio-group input:checked + span, .chip-group input:checked + span { color: #fff; }
  .radio-group label:has(input:checked), .chip-group label:has(input:checked) {
    background: #24211d; border-color: #24211d;
  }

  .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .upload-box {
    border: 2px dashed #ddd0b8; border-radius: 10px; padding: 16px; text-align: center;
    font-size: 12.5px; color: #8a7d68; background: #fdfbf7;
  }
  .upload-box b { display: block; font-size: 13px; color: #24211d; margin-bottom: 4px; }
  .upload-box input { margin-top: 8px; font-size: 12px; width: 100%; }
  .upload-box.optional { opacity: 0.85; }
  .tag-req { color: #b3402c; font-size: 11px; margin-left: 4px; }
  .tag-opt { color: #8a7d68; font-size: 11px; margin-left: 4px; }

  button[type=submit] {
    width: 100%; padding: 15px; background: #24211d; color: #efe9df; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  button[type=submit]:hover { background: #3a332c; }
  button[type=submit]:disabled { opacity: 0.6; cursor: not-allowed; }

  .privacy { font-size: 11.5px; color: #8a7d68; margin-top: 14px; line-height: 1.6; }
  #status { text-align: center; margin-top: 18px; font-size: 13.5px; color: #6b6155; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">손 금 연 구 소 &nbsp; 해 나</div>
    <h1>손금 정밀 리포트 신청</h1>
    <p>손 사진과 간단한 정보를 남겨주시면, 개인 맞춤 손금 리포트를 PDF로 만들어드립니다.</p>
  </header>

  <form id="intakeForm">
    <div class="field row2">
      <div>
        <label>이름 / 닉네임</label>
        <input type="text" name="name" required placeholder="예: 홍길동">
      </div>
      <div>
        <label>나이<span class="hint">(만 나이)</span></label>
        <input type="number" name="age" min="14" max="100" required placeholder="예: 34">
      </div>
    </div>

    <div class="field">
      <label>성별</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="여성"><span>여성</span></label>
        <label><input type="radio" name="gender" value="남성"><span>남성</span></label>
        <label><input type="radio" name="gender" value="선택 안 함" checked><span>선택 안 함</span></label>
      </div>
    </div>

    <div class="field">
      <label>가장 궁금한 주제</label>
      <div class="chip-group">
        <label><input type="radio" name="interest" value="연애" checked><span>연애·인연</span></label>
        <label><input type="radio" name="interest" value="재물"><span>재물·돈</span></label>
        <label><input type="radio" name="interest" value="직업"><span>직업·진로</span></label>
        <label><input type="radio" name="interest" value="건강"><span>건강</span></label>
        <label><input type="radio" name="interest" value="전반적인 삶"><span>전반적인 삶</span></label>
      </div>
    </div>

    <div class="field">
      <label>요즘 가장 큰 고민</label>
      <textarea name="concern" placeholder="예: 매출은 있는데 현금이 잘 안 모여요"></textarea>
    </div>

    <div class="field">
      <label>손 사진 업로드</label>
      <div class="upload-grid">
        <div class="upload-box">
          <b>왼손 정면<span class="tag-req">필수</span></b>
          손바닥이 잘 보이게 정면으로
          <input type="file" name="img_left" accept="image/*" required>
        </div>
        <div class="upload-box">
          <b>오른손 정면<span class="tag-req">필수</span></b>
          손바닥이 잘 보이게 정면으로
          <input type="file" name="img_right" accept="image/*" required>
        </div>
        <div class="upload-box optional">
          <b>주로 쓰는 손 클로즈업<span class="tag-opt">선택</span></b>
          더 가까이서, 선명하게
          <input type="file" name="img_closeup" accept="image/*">
        </div>
        <div class="upload-box optional">
          <b>손날 45도 각도<span class="tag-opt">선택</span></b>
          손을 살짝 돌려 옆면이 보이게
          <input type="file" name="img_side" accept="image/*">
        </div>
      </div>
    </div>

    <button type="submit" id="submitBtn">손금 리포트 받기</button>
    <div class="privacy">
      보내주신 사진과 정보는 리포트 생성에만 사용되며, 발행일로부터 30일 뒤
      자동 삭제됩니다. 본 리포트는 자기 이해를 돕기 위한 참고 자료이며
      의학적·법률적·재무적 판단의 근거로 사용할 수 없습니다.
    </div>
  </form>
  <div id="status"></div>
</div>

<script>
document.getElementById('intakeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '분석 중입니다... (1~2분 소요)';
  status.textContent = '';

  const formData = new FormData(e.target);
  try {
    const res = await fetch('/generate', { method: 'POST', body: formData });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || '리포트 생성에 실패했습니다.');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'palm_report.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = '리포트가 완성되어 다운로드했습니다.';
  } catch (err) {
    status.textContent = '오류: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '손금 리포트 받기';
  }
});
</script>
</body>
</html>
